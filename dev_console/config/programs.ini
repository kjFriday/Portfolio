; Dev Console programs: one section per program, in the order of [programs] order.
; The console's Versions & commands view edits and saves this file.
;
;   name          short name in the list
;   dir           project folder, relative to the portfolio root
;   lang          Python, Go or Rust
;   launch        starts the program; flags such as --version are added after it
;   test          runs its tests
;   build         builds it (empty: nothing to build)
;   desktop_build steps the Desktop shortcuts button runs, separated by &&
;   desktop_run   what the desktop shortcut starts: an exe relative to dir, or "pythonw <args>"
;   version_files files holding the version, relative to dir; the first version line in each is updated
;
; Quote an argument that contains spaces with double quotes.

[programs]
order = crud_hub, doc_pipeline, journal, notify_hub, ticket_tracker, data_dash, wizard_maker, storage_manager

[crud_hub]
name = CRUD Hub
dir = create_read_update_delete_simple_io_data_base
lang = Python
launch = python main.py
test = python -m unittest discover -p "test_*.py"
build =
desktop_build =
desktop_run = pythonw main.py
version_files = setup.json, version.py

[doc_pipeline]
name = Doc Pipeline
dir = document_mover_and_changer
lang = Python
launch = python -m docpipe
test = python -m unittest discover -s tests
build =
desktop_build =
desktop_run = pythonw -m docpipe
version_files = setup.json, docpipe/__init__.py

[journal]
name = Journal
dir = content_management_system
lang = Go
launch = go run .
test = go test ./...
build = go build ./...
desktop_build = go build -trimpath -ldflags "-H windowsgui" -o generic-company-cms.exe .
desktop_run = generic-company-cms.exe
version_files = setup.json, internal/app/app.go

[notify_hub]
name = Notify Hub
dir = notification_and_message_hub
lang = Go
launch = go run ./cmd/notify
test = go test ./...
build = go build ./...
desktop_build = go build -trimpath -ldflags "-H windowsgui" -o generic-company-notify.exe ./cmd/notify
desktop_run = generic-company-notify.exe
version_files = setup.json, internal/app/app.go

[ticket_tracker]
name = Ticket Tracker
dir = simple_ticket_tracker
lang = Rust
launch = cargo run --release --features desktop --
test = cargo test
build = cargo build --release --features desktop
desktop_build = wasm-pack build --target web --out-dir www/pkg --no-typescript && cargo build --release --features desktop
desktop_run = target/release/generic-company-tickets.exe
version_files = setup.json, Cargo.toml

[data_dash]
name = Data Dash
dir = data_dash
lang = Rust
launch = cargo run --release --features desktop --
test = cargo test
build = cargo build --release --features desktop
desktop_build = wasm-pack build --target web --out-dir www/pkg --no-typescript && cargo build --release --features desktop
desktop_run = target/release/generic-company-dash.exe
version_files = setup.json, Cargo.toml

[wizard_maker]
name = Wizard Maker
dir = install_wizard_maker
lang = Go
launch = go run .
test = go test ./...
build = go build ./...
desktop_build = go build -trimpath -ldflags "-H windowsgui -s -w" -o wizard-maker.exe .
desktop_run = wizard-maker.exe
version_files = setup.json, internal/app/app.go

[storage_manager]
name = Storage Manager
dir = drive_and_network_storage_manager
lang = Python
launch = python storage_manager.py
test = python storage_manager.py --selftest
build =
desktop_build =
desktop_run = pythonw storage_manager.py
version_files = setup.json, storage_manager.py

[qr_studio]
name = QR Studio
dir = qr_code_studio
lang = Python
launch = python qr_studio.py
test = python -m unittest test_qr_studio
build =
desktop_build =
desktop_run = pythonw qr_studio.py
version_files = setup.json, qr_studio.py
