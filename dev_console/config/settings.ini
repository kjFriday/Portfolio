; Dev Console settings. The console saves your own changes (such as text size) to
; %LOCALAPPDATA%\Generic Company Inc\GenericCompany.DevConsole\settings.ini; this file holds the defaults.

[view]
; Text and UI scale; Ctrl+Plus / Ctrl+Minus change it by zoom_step.
zoom      = 1.0
zoom_step = 0.1
zoom_min  = 0.5
zoom_max  = 3.0

[live]
; How often live mode looks for saved files, in milliseconds.
interval_ms = 1000
; Folders live mode never looks in.
skip = .git, target, dist, __pycache__, node_modules, .venv
