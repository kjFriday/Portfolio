; Dev Console keyboard controls.
; Copy this file to %LOCALAPPDATA%\Generic Company Inc\GenericCompany.DevConsole\controls.ini to override
; single keys; lines you leave out keep these defaults.
; Format: action = Modifier+Modifier+Key  (modifiers: Ctrl, Shift, Alt; keys: A-Z, 0-9, F1-F12, Plus, Minus, ...)
; Leave a value empty to turn that control off.

[controls]
zoom_in     = Ctrl+Plus
zoom_out    = Ctrl+Minus
zoom_reset  = Ctrl+0
test_all    = Ctrl+Shift+T
build       = F4
test        = F5
run         = F6
version     = F7
smoke       = F8
toggle_live = Ctrl+L
desktop_shortcuts = Ctrl+Shift+D
view_run      = Ctrl+1
view_versions = Ctrl+2
view_seed     = Ctrl+3
view_production = Ctrl+4
next        = Ctrl+Down
previous    = Ctrl+Up
